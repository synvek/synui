[package]
name = "synui-bench"
description = "Performance benchmarks for SynUI hot paths"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
synui-core = { workspace = true }
synui-layout = { workspace = true }
synui-render = { workspace = true }
synui-widgets = { workspace = true }
synui-theme = { workspace = true }
synui = { workspace = true }
vello = { workspace = true }

[features]
default = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "layout_paint"
harness = false

[[bench]]
name = "facade_api"
harness = false
