[package]
name = "synui-render"
description = "Vello rendering pipeline for SynUI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
synui-core = { workspace = true }
vello = { workspace = true }
vello_svg = { workspace = true }
velato = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
parley = { workspace = true }
fontique = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
resvg = { workspace = true }
tiny-skia = "0.11"
usvg = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
thiserror = { workspace = true }
bytemuck = { version = "1.25", features = ["derive"] }
vello_encoding = "0.7"
vello_common = "0.0.9"
glifo = "0.1.1"
vello_cpu = "0.0.9"
winit = { workspace = true }

# Hybrid pulls wgpu 29; keep it off wasm32 so wasm-bindgen sees a single web-sys Gpu* set.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_hybrid = "0.0.9"
wgpu29 = { package = "wgpu", version = "29", default-features = false, features = ["std", "wgsl"] }

[features]
default = []
