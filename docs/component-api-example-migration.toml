schema_version = 1
manifest = "component-api-example-migration"
workspace_manifest = "Cargo.toml"
documentation = ["docs/api-reference-v0.2.md", "docs/migration-v0.2.md"]
allowed_classifications = ["migrated", "needs_migration", "retained_engine", "non_production", "deferred"]
allowed_platforms = ["desktop", "web", "android", "ios"]
allowed_workloads = ["facade-compilation", "component-interaction", "virtual-data", "rich-text-style", "headless-render", "a11y", "platform", "native-abi", "python-sdk", "plugin-experimental"]
denylist_symbols = ["WidgetStore", "ViewEngine", "Engine layout/render types", "numeric action identifiers", "global key/memo/section scheduling", "plugin registry/loading symbols", "JSON View creation symbols"]

# The allowlist is deliberately application-facing. A record marked
# external_element/advanced_integration/deferred is not a Prelude promise.
[[components]]
id = "text"
canonical_path = "synui::view::Node::text"
type_name = "Node"
prelude = true
stability = "stable"
source_paths = ["crates/synui/src/view.rs"]
ownership = "AppContext owns the mounted Element tree; text has no external mutable resource."
thread_rule = "Build, update, and unmount on the owning App UI thread."
lifecycle = "Node composition resolves identity at mount, updates from the next Node snapshot, and unmounts with its parent."
error_contract = "ElementError is returned by validation/mount; missing text is rejected before Engine access."
identity_policy = "Automatic positional identity; use BusinessKey only for repeated sibling text nodes."
event_model = "Text is non-interactive and declares no event slot."
a11y_metadata = "Optional Accessibility role/name/value metadata is carried by the Element contract."
replacement = "No replacement; use synui::view::Node::text."
fixture_commands = ["cargo test -p synui --test counter_prelude_fixture"]
validation_workloads = ["facade-compilation", "headless-render", "a11y"]
boundary_note = "Stable application-level text construction; retained Engine text widgets remain internal."

