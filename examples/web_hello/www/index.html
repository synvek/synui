<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SynUI web_hello</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        max-width: 40rem;
      }
      #synui-canvas {
        display: block;
        width: 800px;
        height: 600px;
        max-width: 100%;
        background: #1a1a2e;
        border-radius: 8px;
      }
      #synui-a11y-host {
        margin-top: 1rem;
        padding: 0.75rem;
        border: 1px dashed #888;
        min-height: 3rem;
      }
      #synui-error {
        display: none;
        margin: 1rem 0;
        padding: 0.75rem 1rem;
        border: 1px solid #c00;
        border-radius: 6px;
        color: #c00;
        background: #fff5f5;
      }
      code {
        background: #f0f0f0;
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>SynUI web_hello</h1>
    <div id="synui-error" role="alert" aria-live="assertive"></div>
    <p>
      SynUI <code>Application</code> + Vello/WebGPU when available. DomA11y
      mirrors the same widget tree under <code>#synui-a11y-host</code>.
    </p>
    <canvas id="synui-canvas" width="800" height="600"></canvas>
    <h2>ARIA host</h2>
    <div id="synui-a11y-host" aria-live="polite"></div>
    <script type="module">
      import init from "./pkg/web_hello.js";
      await init();
    </script>
  </body>
</html>
